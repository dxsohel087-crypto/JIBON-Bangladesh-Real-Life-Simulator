name: Request Unity Personal License File

on:
  workflow_dispatch:

jobs:
  request-activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Create activation request file
        id: request
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ${{ steps.request.outputs.filePath }}
          if-no-files-found: error
