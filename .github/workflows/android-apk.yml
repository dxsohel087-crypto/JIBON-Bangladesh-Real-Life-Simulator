name: JIBON RUNNER Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GodotProject/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Check Android build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          java -version
          sdkmanager --licenses </dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Java, Android SDK and debug signing
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Godot project
        run: godot --headless --editor --path GodotProject --quit

      - name: Diagnose Android export setup
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -l "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/34.0.0/aapt" "$ANDROID_HOME/platforms/android-34/android.jar"
          ls -l "$HOME/.android/debug.keystore"
          godot --headless --editor --path GodotProject --quit --verbose

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p GodotProject/build/android
          godot --headless --path GodotProject --export-debug "Android" "$GITHUB_WORKSPACE/GodotProject/build/android/JIBON-RUNNER.apk" --verbose

      - name: Verify APK
        run: |
          test -s GodotProject/build/android/JIBON-RUNNER.apk
          ls -lh GodotProject/build/android/JIBON-RUNNER.apk
          file GodotProject/build/android/JIBON-RUNNER.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: JIBON-RUNNER-Android-APK
          path: GodotProject/build/android/JIBON-RUNNER.apk
          if-no-files-found: error
