name: JIBON RUNNER Web Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'GodotProject/**'
      - '.github/workflows/godot-web-demo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import and validate Godot project
        run: godot --headless --editor --path GodotProject --quit

      - name: Export Web build
        run: |
          mkdir -p GodotProject/build/web
          godot --headless --path GodotProject --export-release "Web" build/web/index.html

      - name: Upload downloadable Web demo
        uses: actions/upload-artifact@v4
        with:
          name: JIBON-RUNNER-Web-Demo
          path: GodotProject/build/web/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: GodotProject/build/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
